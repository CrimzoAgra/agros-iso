name: ISO

# Publishes a new AgrOS ISO on SourceForge (the download in the READMEs) after each change: a push of main here, or
# AgrOS's packages changed (agros's CI starts this once it has published them). Built on GitHub, signed with AgrOS's
# key. Secrets: AGROS_GPG_KEY (the signing key), SF_SSH_KEY (an SSH key only for SourceForge), SF_API_KEY.
on:
  push:
    branches: [main]
    # (not for what doesn't go into the ISO or its build: the docs, the VM test; this workflow's own changes do)
    # (also the files "What changed" counts: it reads this list, GitHub's rules, the last match wins)
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!manual/**'
      - '!testiso.sh'
      - '!LICENSE'
      - '!.gitignore'
      - '!.github/**'
      - '.github/workflows/iso.yml'
  # (agros's CI, with its AGROS_ISO_TOKEN; or by hand, from the Actions tab)
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if nothing changed
        type: boolean
        default: false

# One at a time; a newer one waits for it (the newest commit is the one published last). Per branch: a run from
# another one (skipped below) took the place of main's waiting one
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SF_USER: leagros
  SF_PROJECT: agros-iso

jobs:
  iso:
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
      # (privileged: mkarchiso's mounts)
      options: --privileged
    # (a manual run from another branch would make that branch's ISO the download)
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 210
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      # (first, for the key below: git for a real checkout, not GitHub's file download. Pacman set up before its first
      # call, as in agros's CI: a machine id, no kernel-modules hook with no systemd running, no download user)
      - name: Pacman, and git
        run: |
          systemd-machine-id-setup >/dev/null
          mkdir -p /etc/pacman.d/hooks && ln -sf /dev/null /etc/pacman.d/hooks/36-systemd-modules-load.hook
          sed -i 's/^#*DownloadUser.*/#DownloadUser = alpm/' /etc/pacman.conf
          pacman-key --init
          pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - name: What changed
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push here while AgrOS's CI is publishing packages (its runs on main, started, queued or waiting their turn):
          # waits for them, so this ISO has them; after 90 minutes it builds with what's published. (Started by
          # agros's CI, or by hand: built at once)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            for i in $(seq 90); do
              busy=0
              for status in in_progress queued pending waiting; do
                runs=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/CrimzoAgra/agros/actions/runs?branch=main&status=$status&per_page=1" | grep -o '"total_count": *[0-9]*' | grep -o '[0-9]*$') || true
                [[ $runs =~ ^[0-9]+$ ]] || { echo "::error::Can't read AgrOS's CI status from GitHub"; exit 1; }
                busy=$((busy + runs))
              done
              [ "$busy" = 0 ] && break
              [ "$i" = 90 ] && { echo "::warning::AgrOS's CI still running after 90 minutes: this ISO has the packages published before it"; break; }
              echo "AgrOS's CI is running: waiting for its packages"
              sleep 60
            done
          fi
          # The packages in AgrOS's repo (each agros push changes them)
          # (each one's checksum, not only its version: a rebuild AgrOS's CI publishes under the same version, against
          # new libraries, also makes a new ISO. The whole of it or failed: a download cut off read as part of a list)
          # (?t=: Pages' CDN keeps a copy up to 10 minutes; the query asks for the current one. The build's pacman reads
          # the plain URL, so this waits, up to 15 minutes, until that serves the current one too: the key is the db
          # that's built. Still not: a warning, and the key from what the plain URL serves, as the build)
          db=https://crimzoagra.github.io/agros/x86_64/agros.db
          get() { curl -fsSL --retry 3 --retry-all-errors -o "$2" "$1" || { echo "::error::AgrOS's package repo is unreachable"; exit 1; }; }
          for i in $(seq 30); do
            get "$db?t=$(date +%s)" /tmp/agros-current.db
            get "$db" /tmp/agros.db
            # (no cmp: diffutils isn't installed yet here)
            [ "$(sha256sum </tmp/agros-current.db)" = "$(sha256sum </tmp/agros.db)" ] && break
            [ "$i" = 30 ] && { echo "::warning::Pages still serves an older agros.db after 15 minutes: the ISO is built from it"; break; }
            echo "Pages' CDN still serves an older agros.db: waiting for it"
            sleep 30
          done
          list=$(bsdtar -xOf /tmp/agros.db | grep -A1 '^%SHA256SUM%$' | grep -v '^%\|^--' | sort) && [ -n "$list" ] ||
            { echo "::error::AgrOS's package repo is empty or unreachable"; exit 1; }
          pkgs=$(sha256sum <<<"$list" | cut -c1-16)
          # What goes into the ISO: the files on.push.paths lets through (read from this file, so it's the one list), not
          # the commit, so a docs-only commit doesn't make the next run build the same ISO again. GitHub's patterns: * not
          # across a /, ** across, ! leaves out, the last match wins
          pats=$(awk '/^    paths:$/ { on = 1; next } on && /^      - / { sub(/^      - /, ""); gsub(/'\''/, ""); print; next } { on = 0 }' .github/workflows/iso.yml)
          [ -n "$pats" ] || { echo "::error::No on.push.paths in iso.yml for the key"; exit 1; }
          src=$(git -c safe.directory="$PWD" ls-files -s | awk -v pats="$pats" '
            BEGIN { n = split(pats, p, "\n")
              for (i = 1; i <= n; i++) {
                neg[i] = sub(/^!/, "", p[i]); r = p[i]
                gsub(/[.+^$(){}|\\[\]]/, "\\\\&", r); gsub(/\*\*/, "\001", r); gsub(/\*/, "[^/]*", r); gsub(/\001/, ".*", r); gsub(/\?/, "[^/]", r)
                re[i] = "^" r "$" } }
            { path = $0; sub(/^[^\t]*\t/, "", path); keep = 0
              for (i = 1; i <= n; i++) if (path ~ re[i]) keep = !neg[i]
              if (keep) print }' | sha256sum | cut -c1-16)
          # shortcut: GitHub drops a cache entry unused for 7 days, so a quiet week publishes the same ISO again (under a
          # new name); a marker on SourceForge would avoid it if that matters
          echo "key=iso-published-$src-$pkgs" >>"$GITHUB_OUTPUT"
      # (not for a push: on.push.paths already lets only ISO changes through, and a revert to a state published
      # before must publish again, not count as done)
      - name: Already published?
        id: done
        if: ${{ !inputs.force && github.event_name != 'push' }}
        uses: actions/cache/restore@v6
        with:
          path: /tmp/published
          key: ${{ steps.what.outputs.key }}
          lookup-only: true
      - name: Build tools, and CachyOS's and AgrOS's keys
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          df -h /
          # (what the build itself needs, buildiso.sh installs: its list is in util.sh's check_requirements)
          pacman -Syu --noconfirm --needed git sudo rsync openssh gnupg
          m=https://mirror.cachyos.org/repo/x86_64/cachyos
          k=$(curl -fsSL --retry 3 --retry-all-errors "$m/" | grep -o 'cachyos-keyring-[^"]*\.pkg\.tar\.zst' | sort -V | tail -1) || true
          [ -n "$k" ] || { echo "::error::No cachyos-keyring package in CachyOS's repo listing ($m/)"; exit 1; }
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/keyring.pkg "$m/$k"
          mkdir /tmp/k && bsdtar -xf /tmp/keyring.pkg -C /tmp/k
          pacman-key --add /tmp/k/usr/share/pacman/keyrings/cachyos.gpg
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47
      - name: The builder, its signing key and SourceForge key
        if: steps.done.outputs.cache-hit != 'true'
        env:
          AGROS_GPG_KEY: ${{ secrets.AGROS_GPG_KEY }}
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          [ -n "$AGROS_GPG_KEY" ] && [ -n "$SF_SSH_KEY" ] || { echo "::error::Add the AGROS_GPG_KEY and SF_SSH_KEY secrets"; exit 1; }
          # (its fingerprint read from agros.asc, the one place it's named: util.sh's key_fpr, as the build signs with)
          pacman-key --add agros.asc
          fpr=$(. ./util.sh && key_fpr agros.asc) && [ -n "$fpr" ] || { echo "::error::No key in agros.asc"; exit 1; }
          pacman-key --lsign-key "$fpr"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          echo "$AGROS_GPG_KEY" | runuser -u builder -- gpg --batch --import
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$SF_SSH_KEY" | install -m600 -o builder -g builder /dev/stdin /home/builder/.ssh/id_ed25519
          echo 'frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC' |
            install -m644 -o builder -g builder /dev/stdin /home/builder/.ssh/known_hosts
          cp -a . /home/builder/agros-iso && chown -R builder: /home/builder/agros-iso
      - name: Build and upload
        if: steps.done.outputs.cache-hit != 'true'
        env:
          SF_API_KEY: ${{ secrets.SF_API_KEY }}
        working-directory: /home/builder/agros-iso
        run: |
          as_builder() { runuser -u builder -- env SF_USER="$SF_USER" SF_PROJECT="$SF_PROJECT" SF_API_KEY="$SF_API_KEY" "$@"; }
          as_builder ./upload-iso.sh --check
          as_builder ./buildiso.sh -p desktop -a
          # (the build only warns when it can't sign: --signed, never published unsigned. The newest ISO: the only one)
          # (tried 3 times: a dropped connection uploads it all again, rather than failing the run and its build. Not
          # retried when it refuses the ISO, exit 65: unsigned, a bad checksum or another key's signature stay so)
          for i in 1 2 3; do
            rc=0; as_builder ./upload-iso.sh --signed || rc=$?
            [ "$rc" = 0 ] && exit 0
            [ "$rc" = 65 ] && exit 65
            [ "$i" = 3 ] || sleep 60
          done
          exit 1
      - name: Mark it published
        if: steps.done.outputs.cache-hit != 'true'
        run: mkdir -p /tmp/published && echo "$GITHUB_SHA" >/tmp/published/commit
      - if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/published
          key: ${{ steps.what.outputs.key }}
