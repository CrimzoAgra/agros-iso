# The live system never sleeps, whoever asks (an idle timeout, the session menu, a script): asleep halfway through an
# install, the disk already partitioned, it may not come back to finish it (the USB stick it runs from lost on waking).
# logind's own keys and lid switch: do-not-suspend.conf in logind.conf.d. Only the live system's: the installer copies
# none of its /etc/systemd to the new one
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
