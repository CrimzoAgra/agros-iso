# AgrOS's package list for CachyOS's installer: CachyOS's netinstall.yaml less the other desktops, Firefox,
# Alacritty, CachyOS Hello and CachyOS's fish and micro settings, plus the AgrOS group (agros-desktop: the whole desktop).
# Left out: KDE-Desktop, CachyOS Handhelds, GNOME-Desktop, Cosmic, Niri, Cinnamon, Budgie-Desktop, MATE-Desktop, Xfce4, LXQT-Desktop, LXDE-Desktop, Hyprland, MangoWM, Sway, Wayfire, i3-Window-Manager, Qtile, bspwm, Openbox, Firefox and language package, Support for HP Printer/Scanner
- name: CachyOS required (hidden)
  description: needed CachyOS packages
  hidden: true
  selected: true
  critical: true
  packages:
  - cachyos-hooks
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-rate-mirrors
  - chwd
- name: CachyOS kernels (hidden)
  description: CachyOS kernels to install
  hidden: true
  selected: true
  critical: true
  platform: desktop
  packages:
  - linux-cachyos
  - linux-cachyos-headers
  - linux-cachyos-lts
  - linux-cachyos-lts-headers
- name: AgrOS
  description: 'The AgrOS desktop: Hyprland with the Caelestia shell, its login screen, settings and apps'
  hidden: true
  selected: true
  critical: true
  packages:
  - agros-keyring
  - agros-desktop
- name: CachyOS kernels (hidden/handheld)
  description: CachyOS kernels to install (Handheld)
  hidden: true
  selected: true
  critical: true
  platform: handheld
  packages:
  - linux-cachyos-deckify
  - linux-cachyos-deckify-headers
- name: CachyOS Packages
  description: needed CachyOS packages
  hidden: false
  selected: true
  critical: true
  packages:
  - cachyos-kernel-manager
  - cachyos-packageinstaller
  - cachyos-settings
  - cachyos-wallpapers
