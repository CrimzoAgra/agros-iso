# AgrOS: no boot text on the normal entries: "quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false", the
# list agros's system/boot-video-mode (QUIET, its canonical home) gives installs, less "splash" (no Plymouth on the
# live ISO)
# AgrOS: no cms_verify=y (releng's): the ISO has no CMS signature to check (no code-signing certificate in
# profiledef.sh), and with it a PXE boot stopped at a shell
LABEL arch64_nbd
TEXT HELP
Boot the AgrOS live medium using NBD.
It allows you to install AgrOS or perform system maintenance.
ENDTEXT
MENU LABEL AgrOS live medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false
SYSAPPEND 3

LABEL arch64_nfs
TEXT HELP
