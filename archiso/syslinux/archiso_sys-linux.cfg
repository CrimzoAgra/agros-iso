# AgrOS: no boot text on the normal entries: "quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false", the
# list agros's system/boot-video-mode (QUIET, its canonical home) gives installs, less "splash" (no Plymouth on the
# live ISO). The Legacy Hardware/Fallback entries keep the text, for troubleshooting
LABEL cos64
TEXT HELP
Boot the AgrOS live medium on BIOS.
It allows you to install AgrOS or perform system maintenance.
ENDTEXT
MENU LABEL AgrOS default (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false

# AgrOS: CachyOS's current kernel too, as GRUB's default on UEFI (its files are on the ISO: mkarchiso copies every kernel)
LABEL cos64cur
TEXT HELP
Boot the AgrOS live medium on BIOS with CachyOS's current kernel.
It allows you to install AgrOS or perform system maintenance.
ENDTEXT
MENU LABEL AgrOS current kernel (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr i915.modeset=1 amdgpu.modeset=1 nvme_load=yes quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false

# Fallback (nomodeset)
LABEL cos64fb
TEXT HELP
Boot the AgrOS live medium on BIOS in fallback mode.
It allows you to install AgrOS or perform system maintenance.
ENDTEXT
MENU LABEL AgrOS Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
